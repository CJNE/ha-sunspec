name: Release

# Merging a new version into main publishes it; pushing a version tag
# publishes the commit it names, such as a pre-release on another branch.
on:
  push:
    branches:
      - main
    paths:
      - custom_components/sunspec/manifest.json
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A version that is already released is left alone, as when a merge
      # changes only the requirements in manifest.json.
      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/sunspec/manifest.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but manifest.json has version $version"
            exit 1
          fi
          if ! gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "tag=$version" >> "$GITHUB_OUTPUT"
          fi

      # Each pull request since the last release that changed the integration
      # gives the first paragraph of its description, which says what now
      # happens; GitHub's list of the pull requests follows. A version with a
      # suffix, such as 1.2.3-beta.1, is a pre-release, which Home Assistant
      # offers only to those who ask for it. HACS installs the release from
      # sunspec.zip, the integration's files, and shows how often that file
      # was downloaded.
      - name: Publish the release
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          changes="$RUNNER_TEMP/changes.md"
          : > "$changes"
          for pr in $(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body | grep -oE '/pull/[0-9]+' | cut -d/ -f3 | sort -un); do
            gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json number,author,title,body,files --jq '
              select((.author.is_bot | not) and (.title | startswith("Version ") | not)
                and any(.files[].path; startswith("custom_components/")))
              | "- " + (.body | gsub("\r"; "") | split("\n\n")[0] | gsub("\n"; " ")) + " (#\(.number))"' >> "$changes"
          done
          [ -s "$changes" ] || echo "- None in the integration itself." > "$changes"
          sed "s/{homeassistant}/$(jq -r .homeassistant hacs.json)/" .github/RELEASE_TEMPLATE.md |
            awk -v changes="$changes" '$0 == "{changes}" { while ((getline line < changes) > 0) print line; next } { print }' > "$RUNNER_TEMP/notes.md"
          args=(--target "$GITHUB_SHA" --title "Version $TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          git archive --output "$RUNNER_TEMP/sunspec.zip" HEAD:custom_components/sunspec
          gh release create "$TAG" "$RUNNER_TEMP/sunspec.zip" "${args[@]}"
