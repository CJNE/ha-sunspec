repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        require_serial: true
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        require_serial: true
      - id: prettier
        name: prettier
        entry: prettier --write --list-different --ignore-unknown
        language: node
        types: [text]
        additional_dependencies: ["prettier@3.10.1"]
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        name: isort
        args: [--force-single-line, --profile=black]
